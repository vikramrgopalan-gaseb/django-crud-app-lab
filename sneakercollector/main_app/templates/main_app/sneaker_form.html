{% extends 'base.html' %} 
{% load static %} 

{% block head %}
<link rel="stylesheet" href="{% static 'css/form.css' %}" />
{% endblock %} 

{% block content %}
<div class="page-header">
    {% if object %}
        
        <h1>Edit {{ object.brand }} {{ object.model }}</h1>
    {% else %}
        <h1>Add a Sneaker</h1>
    {% endif %}
    
    <img src="{% static 'images/splash.svg' %}" alt="Sneaker Form Icon" style="width: 100px;"/>
</div>


<form action="" method="POST" class="form-container">
  {% csrf_token %}
  <table>
    {{ form.as_table }}
  </table>
  <button type="submit" class="btn submit">Submit!</button>
</form>
{% endblock %}
